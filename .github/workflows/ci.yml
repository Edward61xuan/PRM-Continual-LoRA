name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install CPU test environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.1.0 torchvision==0.16.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install timm==0.9.12 numpy==1.26.0 Pillow==10.0.1 tqdm==4.66.1 PyYAML==6.0.3 matplotlib==3.10.8 scipy==1.11.3 scikit-learn==1.3.2 safetensors==0.7.0
      - name: Syntax, unit, CLI, and dry-run tests
        run: |
          python -m compileall -q train_prm.py prm scripts tools tests
          python train_prm.py --help
          python -m unittest discover -s tests -v
      - name: Regenerate bundled figures
        run: |
          MPLBACKEND=Agg python create_figures/plot_figure2.py
          MPLBACKEND=Agg python create_figures/plot_figure3.py
